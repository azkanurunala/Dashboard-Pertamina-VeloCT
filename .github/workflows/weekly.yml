name: Weekly (Sentiment Mingguan + SAF Weekly + Crackspread Weekly)

on:
  schedule:
    - cron: "0 1 * * 1"   # Every Monday 08:00 WIB
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    env:
      STORAGE_BACKEND: neon
      NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      SPGLOBAL_USERNAME: ${{ secrets.SPGLOBAL_USERNAME }}
      SPGLOBAL_PASSWORD: ${{ secrets.SPGLOBAL_PASSWORD }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_USER_EMAIL: ${{ secrets.MS_USER_EMAIL }}
      ONEDRIVE_FILE_PATH: ${{ secrets.ONEDRIVE_FILE_PATH }}
      ONEDRIVE_SENTIMENT_PATH: ${{ secrets.ONEDRIVE_SENTIMENT_PATH }}
      ONEDRIVE_DATA_PATH: ${{ secrets.ONEDRIVE_DATA_PATH }}
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}
          restore-keys: pip-

      - name: Install dependencies
        run: pip install -r requirements.txt psycopg2-binary

      - name: Run weekly pipeline
        run: python src/scheduler/scheduling_week.py
