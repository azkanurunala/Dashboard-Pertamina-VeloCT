name: Test Kontan Scraper

on:
  # Manual trigger
  workflow_dispatch:
    inputs:
      keyword:
        description: 'Keyword to scrape'
        required: false
        default: 'ekonomi'
      date:
        description: 'Date filter (YYYY-MM-DD) or leave empty for all'
        required: false
        default: '2024-12-17'
  
  # Auto trigger on push (optional, comment out if not needed)
  push:
    branches:
      - main
    paths:
      - 'src/code_scrapping/kontan.py'
      - '.github/workflows/test-kontan.yml'

jobs:
  test-kontan:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Create .env file
      run: |
        echo "SPREADSHEET_ID=${{ secrets.SPREADSHEET_ID }}" >> .env
        echo "GOOGLE_CREDENTIALS='${{ secrets.GOOGLE_CREDENTIALS }}'" >> .env
        echo "TANGGAL_FILTER=${{ github.event.inputs.date || '2024-12-17' }}" >> .env
    
    - name: Test Kontan Scraper
      run: |
        cd src/main
        python test_kontan.py
      env:
        PYTHONUNBUFFERED: 1
      timeout-minutes: 30
    
    - name: Upload backup if exists
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: kontan-backup
        path: src/main/backup_*.xlsx
        if-no-files-found: ignore
    
    - name: Check for errors
      if: failure()
      run: |
        echo "❌ Test failed! Check logs above for details."
        echo "Common issues:"
        echo "  - 403 Forbidden: Site blocking GitHub Actions IP"
        echo "  - Timeout: Scraping took too long"
        echo "  - Credentials: Check GOOGLE_CREDENTIALS secret"