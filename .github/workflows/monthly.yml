name: Monthly (EIA + ESDM OCR + Biodiesel + Bioetanol + Crackspread + WTE + IAEA + Kapasitas EBT)

on:
  schedule:
    # 08:00 WIB pada tanggal: 1 (EIA+ESDM+biodiesel+bioetanol), 12 (petrochemical +
    # BBM forecast), 15 (WTE SIPSN + IAEA), 28 (kapasitas EBT).
    # Gating per-tanggal ada di src/scheduler/scheduling_month.py.
    - cron: "0 1 1,12,15,28 * *"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 600

    env:
      STORAGE_BACKEND: neon
      NEON_DB_URL: ${{ secrets.NEON_DB_URL }}
      SPGLOBAL_USERNAME: ${{ secrets.SPGLOBAL_USERNAME }}
      SPGLOBAL_PASSWORD: ${{ secrets.SPGLOBAL_PASSWORD }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
      MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
      MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
      MS_USER_EMAIL: ${{ secrets.MS_USER_EMAIL }}
      ONEDRIVE_FILE_PATH: ${{ secrets.ONEDRIVE_FILE_PATH }}
      ONEDRIVE_SENTIMENT_PATH: ${{ secrets.ONEDRIVE_SENTIMENT_PATH }}
      ONEDRIVE_DATA_PATH: ${{ secrets.ONEDRIVE_DATA_PATH }}
      CI: "true"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Cache pip (includes torch + easyocr — large)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-monthly-${{ hashFiles('requirements.txt', 'requirements-ocr.txt') }}
          restore-keys: pip-monthly-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt psycopg2-binary
          pip install -r requirements-ocr.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run monthly pipeline
        run: python -u src/scheduler/scheduling_month.py
