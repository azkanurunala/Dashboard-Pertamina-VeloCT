name: 🤖 Batch Scraper (Tanggal 02-17)

on:
  # Manual trigger via GitHub UI
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Tanggal mulai (YYYY-MM-DD)'
        required: true
        default: '2025-12-02'
      end_date:
        description: 'Tanggal akhir (YYYY-MM-DD)'
        required: true
        default: '2025-12-17'

jobs:
  scrape-news:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # 6 hours max
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      
      - name: 🌐 Setup Chrome & ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable
      
      - name: 📦 Install Dependencies
        run: |
          echo "📦 Installing Python packages..."
          pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          
          echo "✅ Installed packages:"
          pip list | grep -E "gspread|google-auth|pandas|selenium|beautifulsoup4|requests"
      
      - name: 🔧 Verify Chrome Installation
        run: |
          echo "🌐 Chrome version:"
          google-chrome --version
          
          echo "🔧 ChromeDriver version:"
          chromedriver --version || echo "ChromeDriver will be auto-downloaded by webdriver-manager"
      
      - name: 🚀 Run Batch Scraper
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          START_DATE: ${{ github.event.inputs.start_date }}
          END_DATE: ${{ github.event.inputs.end_date }}
        run: |
          echo "🤖 Starting batch scraper..."
          echo "📅 Start Date: $START_DATE"
          echo "📅 End Date: $END_DATE"
          echo "📊 Spreadsheet: ${SPREADSHEET_ID:0:20}..."
          echo ""
          
          # Run scraper with output logging
          python src/main/batch_runner.py 2>&1 | tee batch_scraper.log
      
      - name: 📊 Upload Logs & Backups
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-results-${{ github.run_number }}
          path: |
            batch_scraper*.log
            backup_*.xlsx
            *.log
          retention-days: 7
          if-no-files-found: warn
      
      - name: 💬 Success Summary
        if: success()
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════════════"
          echo "✅ ✅ ✅ BATCH SCRAPING COMPLETED SUCCESSFULLY! ✅ ✅ ✅"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          echo "📊 Your Google Sheet has been updated!"
          echo "📅 Date range: ${{ github.event.inputs.start_date }} to ${{ github.event.inputs.end_date }}"
          echo "🔗 Check your sheet: https://docs.google.com/spreadsheets/d/${{ secrets.SPREADSHEET_ID }}"
          echo ""
          echo "📝 View detailed logs in the Artifacts section above"
          echo "════════════════════════════════════════════════════════════════"
      
      - name: ❌ Failure Summary
        if: failure()
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════════════"
          echo "❌ BATCH SCRAPING FAILED"
          echo "════════════════════════════════════════════════════════════════"
          echo ""
          echo "🔍 Troubleshooting steps:"
          echo "   1. Check the error messages in the log above"
          echo "   2. Download artifacts to see detailed logs"
          echo "   3. Common issues:"
          echo "      • Missing GOOGLE_CREDENTIALS secret"
          echo "      • Missing SPREADSHEET_ID secret"
          echo "      • Invalid date format"
          echo "      • Network timeout (try smaller date range)"
          echo ""
          echo "💾 Backup files (if any) are saved in Artifacts"
          echo "📋 Any successfully scraped data is already in Google Sheets"
          echo "════════════════════════════════════════════════════════════════"
      
      - name: 🧹 Cleanup
        if: always()
        run: |
          echo "🧹 Cleaning up temporary files..."
          rm -f *.log 2>/dev/null || true
          echo "✅ Cleanup complete"